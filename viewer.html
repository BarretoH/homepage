<!DOCTYPE html>
<html>
  <head>
    <title>Track Papi's Phone</title>
    <style>
      #map {
        height: 90vh;
        width: 100%;
        display: none;
      }
      #controls {
        display: none;
        padding: 10px;
        background: #f8f8f8;
        font-family: sans-serif;
      }
    </style> 

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  </head>

  <body>
    <h2>Track Papi's Phone</h2>

    <!-- Password prompt -->
    <div id="pwDiv">
      <p>Enter password to view location:</p>
      <input type="password" id="pwInput" placeholder="Password">
      <button onclick="checkPassword()">Submit</button>
      <p id="pwError" style="color: red;"></p>
    </div>

    <!-- Controls for selecting history range -->
    <div id="controls">
      Show location history for the past:
      <select id="daysSelect">
        <option value="1">1 day</option>
        <option value="3">3 days</option>
        <option value="7" selected>7 days</option>
        <option value="30">30 days</option>
      </select>
      <button onclick="loadLocationHistory()">Update Map</button>
    </div>

    <!-- Map display -->
    <div id="map"></div>

    <script>
      // Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyBEIockrAeynpeS8BYxHXOKSzCDEq10ijE",
        authDomain: "donde-esta-papi.firebaseapp.com",
        databaseURL: "https://donde-esta-papi-default-rtdb.firebaseio.com",
        projectId: "donde-esta-papi",
        storageBucket: "donde-esta-papi.appspot.com",
        messagingSenderId: "70591848578",
        appId: "1:70591848578:web:b4d472ba9f49f2cf51949b",
        measurementId: "G-363H0T42T8"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let map;
      let markers = [];
      let polyline;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 2,
          center: { lat: 0, lng: 0 }
        });

        // Load default data (7 days)
        loadLocationHistory();
      }

      function clearMap() {
        markers.forEach(marker => marker.setMap(null));
        markers = [];
        if (polyline) {
          polyline.setMap(null);
          polyline = null;
        }
      }

      function loadLocationHistory() {
        const days = parseInt(document.getElementById('daysSelect').value);
        const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;

        db.ref("phoneLocationHistory").once("value").then(snapshot => {
          clearMap();
          const coords = [];

          snapshot.forEach(child => {
            const data = child.val();
            if (data.timestamp >= cutoff) {
              const latLng = new google.maps.LatLng(data.lat, data.lng);
              coords.push(latLng);
              const marker = new google.maps.Marker({
                position: latLng,
                map: map,
                title: new Date(data.timestamp).toLocaleString()
              });
              markers.push(marker);
            }
          });

          if (coords.length > 0) {
            if (coords.length > 1) {
              polyline = new google.maps.Polyline({
                path: coords,
                geodesic: true,
                strokeColor: "#0000FF",
                strokeOpacity: 1.0,
                strokeWeight: 2
              });
              polyline.setMap(map);
              map.fitBounds(new google.maps.LatLngBounds(...coords));
            } else {
              map.setCenter(coords[0]);
              map.setZoom(15);
            }
          } else {
            alert("No location data found for the selected time range.");
          }
        });
      }

      function checkPassword() {
        const inputPw = document.getElementById("pwInput").value;
        db.ref("viewerSecret").once("value").then((snapshot) => {
          const storedPw = snapshot.val();
          if (inputPw === storedPw) {
            document.getElementById("pwDiv").style.display = "none";
            document.getElementById("controls").style.display = "block";
            document.getElementById("map").style.display = "block";
            initMap();
          } else {
            document.getElementById("pwError").innerText = "Incorrect password.";
          }
        }).catch((error) => {
          console.error("Error reading password:", error);
          document.getElementById("pwError").innerText = "Error checking password.";
        });
      }
    </script>

    <!-- Google Maps API (your key already present) -->
    <script async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDBjewnlM7Is-isIy0m0EH_cpQVxLWuIkk">
    </script>
  </body>
</html>
