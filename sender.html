<!DOCTYPE html>
<html>
<head>
  <title>Send My Location</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
  <h2>Sending Location...</h2>
  <p id="status">Waiting for permission...</p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBEIockrAeynpeS8BYxHXOKSzCDEq10ijE",
      authDomain: "donde-esta-papi.firebaseapp.com",
      databaseURL: "https://donde-esta-papi-default-rtdb.firebaseio.com",
      projectId: "donde-esta-papi",
      storageBucket: "donde-esta-papi.firebasestorage.app",
      messagingSenderId: "70591848578",
      appId: "1:70591848578:web:b4d472ba9f49f2cf51949b",
      measurementId: "G-363H0T42T8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function sendLocation(position) {
      const coords = {
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        timestamp: Date.now(),
        secret: "cuban"
      };
      // Save to history node (for multiple days)
      const newRef = db.ref("phoneLocationHistory").push();
      newRef.set(coords)
        .then(() => {
          document.getElementById("status").textContent = "Location sent at " + new Date().toLocaleTimeString();
        })
        .catch(error => {
          document.getElementById("status").textContent = "Firebase error: " + error.message;
        });
    }

    function handleError(error) {
      document.getElementById("status").textContent = "Error: " + error.message;
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(sendLocation, handleError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
      });
    } else {
      document.getElementById("status").textContent = "Geolocation not supported.";
    }
  </script>
</body>
</html>
